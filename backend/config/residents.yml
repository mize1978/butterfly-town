# 街の AI 住民（MVP は3人）。DB にはこの key を文字列で保存する（residents.key）。
# key と最初の場所（location）は仮（技術試作の住民 A・B・C と場所 plaza・shop・home に合わせた）。
# 名前・人格・目標・初期の記憶は #9・#11 で足す。
# key を変えるときは residents の CHECK 制約（residents_key_in_catalog）もマイグレーションで変える
residents:
  - key: a
    location: plaza
  - key: b
    location: home
  - key: c
    location: shop
